[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dnsone"
dynamic = ["version"]
description = "DNSOne: authoritative zones, caching recursion and RPZ ad-blocking"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.161.0",
    "starlette==1.9.0",
    "pydantic==2.14.1",
    "uvicorn[standard]==0.54.0",
    "SQLAlchemy==2.1.6",
    "PyMySQL==1.2.3",
    "cryptography==50.0.2",
    "argon2-cffi==25.1.0",
    "httpx==0.28.1",
    "dnspython==2.9.0",
    "idna==3.20",
    "segno==1.6.6",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
dnsone-ctl = "dnsone.cli:main"
dnsone-querylog = "dnsone.querylog:main"
dnsone-ddns = "dnsone.ddns:main"

[tool.setuptools]
packages = ["dnsone", "dnsone.api"]

[tool.setuptools.dynamic]
version = {attr = "dnsone.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
