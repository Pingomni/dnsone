# Security headers for the DNSOne console, installed as /etc/nginx/snippets/dnsone-headers.conf.
# Included in the server block and again in every location that sets its own add_header: nginx drops
# the server's add_header lines in such a location, so without this the console page and its files
# would be served without them.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
