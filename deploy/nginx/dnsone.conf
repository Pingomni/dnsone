# DNSOne web console. Installed as /etc/nginx/sites-available/dnsone (linked into sites-enabled).
# CHANGE_ME_MGMT_IP: the management address; CHANGE_ME_FQDN: its host name.
# The certificate paths match the self-signed pair the runbook creates; replace with a real certificate.

limit_req_zone $binary_remote_addr zone=dnsone_login:10m rate=10r/m;

server {
    listen CHANGE_ME_MGMT_IP:80;
    server_name CHANGE_ME_FQDN;
    return 301 https://$host$request_uri;
}

server {
    listen CHANGE_ME_MGMT_IP:443 ssl http2;
    server_name CHANGE_ME_FQDN;

    ssl_certificate     /etc/ssl/dnsone/dnsone.crt;
    ssl_certificate_key /etc/ssl/dnsone/dnsone.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:dnsone:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /opt/dnsone/frontend/dist;
    client_max_body_size 4m;

    location = /api/auth/login {
        limit_req zone=dnsone_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/dnsone-proxy.conf;
    }

    # Second sign-in step (two-factor codes): rate-limited like the password.
    location = /api/auth/login/verify {
        limit_req zone=dnsone_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/dnsone-proxy.conf;
    }

    # Settings → Backup: a restore uploads the whole backup (zones included).
    location = /api/settings/restore {
        client_max_body_size 64m;
        include /etc/nginx/snippets/dnsone-proxy.conf;
    }

    location /api/ {
        include /etc/nginx/snippets/dnsone-proxy.conf;
    }

    # Single sign-on: rate-limited like the password sign-in.
    location = /api/auth/oidc/login {
        limit_req zone=dnsone_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/dnsone-proxy.conf;
    }

    # Dynamic DNS for routers (dyndns2): https://CONSOLE/nic/update?hostname=...&myip=...
    location = /nic/update {
        limit_req zone=dnsone_login burst=20 nodelay;
        limit_req_status 429;
        rewrite ^ /api/ddns/nic/update break;
        include /etc/nginx/snippets/dnsone-proxy.conf;
    }

    # Built files have hashed names: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Client-side routes (/zones/12, /blocking ...) all load the SPA.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
