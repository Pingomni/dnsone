# DNSOne: the legal notice page for court-ordered blocking. Installed as
# /etc/nginx/sites-available/dnsone-legal (linked into sites-enabled) when Settings → Court orders
# gives a page address. CHANGE_ME_LEGAL_IP: that address, on this server (an extra IP on the
# customer-facing interface works; not the console's address). IPv6: add a second listen line.
#
# Customers' browsers ask for a blocked name, get this address, and land here over HTTP with the
# blocked name in the Host header; DNSOne answers "451 Unavailable For Legal Reasons" with the notice
# and the order. HTTPS cannot be answered for names that are not ours (the certificate would not
# match), so nothing listens on 443 here and browsers show a connection error for https:// links.

limit_req_zone $binary_remote_addr zone=dnsone_legal:10m rate=30r/m;

server {
    listen CHANGE_ME_LEGAL_IP:80 default_server;
    server_name _;
    server_tokens off;
    access_log off;

    location / {
        limit_req zone=dnsone_legal burst=30 nodelay;
        limit_req_status 429;
        rewrite ^ /api/legal/notice break;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_intercept_errors off;
    }
}
