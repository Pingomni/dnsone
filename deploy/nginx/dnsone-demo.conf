# DNSOne public demo: the console with sample data, answered in the visitor's browser (no backend,
# no database, nothing reaches the DNS servers). Installed as /etc/nginx/sites-available/dnsone-demo
# by ops/dnsone-demo-deploy, which fills in CHANGE_ME_IP and CHANGE_ME_DEMO_FQDN.

server {
    listen CHANGE_ME_IP:80;
    server_name CHANGE_ME_DEMO_FQDN;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen CHANGE_ME_IP:443 ssl http2;
    server_name CHANGE_ME_DEMO_FQDN;

    ssl_certificate     /etc/letsencrypt/live/CHANGE_ME_DEMO_FQDN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHANGE_ME_DEMO_FQDN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:dnsone_demo:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    # The demo build (npm run build:demo), a separate folder from the real console.
    root /var/www/demo-dns;

    # The demo has no API on the server: the browser answers /api itself.
    location /api/ {
        include /etc/nginx/snippets/dnsone-demo-headers.conf;
        return 404;
    }

    location /assets/ {
        include /etc/nginx/snippets/dnsone-demo-headers.conf;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/dnsone-demo-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
