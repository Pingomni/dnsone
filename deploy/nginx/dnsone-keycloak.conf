# Keycloak (single sign-on) under the console's address: https://<console>/auth/.
# Installed as /etc/nginx/snippets/dnsone-keycloak.conf and included in the console's server block.
location /auth/ {
    proxy_pass http://127.0.0.1:8180;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    # Keycloak sends its own security headers (CSP with what its pages need: inline scripts for the
    # dark theme and sign-in checks, frames for its account page). An add_header here also stops nginx
    # from adding the console's stricter CSP and X-Frame-Options from the server block, which
    # otherwise break those pages (invisible labels in dark mode). Only HSTS is kept.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Keycloak's responses carry large cookies and headers.
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
}
