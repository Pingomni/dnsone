# DNSOne: PowerDNS Recursor 4.9 (Ubuntu 24.04 package), the caching resolver behind dnsdist.
# Installed as /etc/powerdns/recursor.conf.

# Only dnsdist talks to the Recursor, over loopback, with a PROXY protocol header carrying the
# customer's address. Only dnsdist (127.0.0.1) may send such headers.
local-address=127.0.0.1
local-port=5300
proxy-protocol-from=127.0.0.1
# Allowed clients, checked against the customer's address. Generated by DNSOne from
# Settings → DNS server (the same networks dnsdist routes here); reloaded with rec_control reload-acls.
allow-from-file=/var/lib/dnsone/recursor/allow-from.conf

# RPZ ad-blocking is configured in Lua (rpzFile).
lua-config-file=/etc/powerdns/recursor.lua
# Per-client groups, paused blocking and regex rules (DNSOne policy script; data in /var/lib/dnsone/recursor).
lua-dns-script=/etc/powerdns/dnsone.lua

# Zones hosted on this server are answered by the local BIND (written by the zone generator).
forward-zones-file=/var/lib/dnsone/recursor/forward-zones.conf

# Settings → DNS server → Resolver (EDNS Client Subnet, serve-stale), written by DNSOne as dnsone.conf
# here; DNSOne restarts the Recursor when they change. Settings in that file win over this one.
include-dir=/var/lib/dnsone/recursor/conf.d

# Sizing for ~50,000 clients. One thread per core is a good start; raise the caches with RAM.
threads=4
max-cache-entries=2000000
max-packetcache-entries=1000000
max-negative-ttl=3600
max-cache-ttl=86400

# Validate DNSSEC for every client: forged or broken answers become SERVFAIL. Hosted zones are
# exempt through negative trust anchors (recursor.lua), since DNSOne serves them unsigned.
dnssec=validate

# Do not reveal versions.
version-string=
security-poll-suffix=

# Statistics API for DNSOne (loopback only).
webserver=yes
webserver-address=127.0.0.1
webserver-port=8082
webserver-allow-from=127.0.0.1/32
api-key=CHANGE_ME_RECURSOR_API_KEY

quiet=yes
loglevel=4
