-- DNSOne: dnsdist 1.8 (Ubuntu 24.04 package). Installed as /etc/dnsdist/dnsdist.conf.
--
--   clients --53--> dnsdist --> PowerDNS Recursor 127.0.0.1:5300 (cache + RPZ) --> BIND 127.0.0.1:5301
--   internet resolvers --53--> dnsdist --> BIND 127.0.0.1:5301   (hosted zones only, if enabled)
--
--   dynamic DNS updates (RFC 2136, TSIG) --53--> dnsdist --> dnsone-ddns 127.0.0.1:5302 (if enabled)
--
-- Customer networks, NAT addresses, rate limits, public authoritative DNS, dynamic DNS, dnstap and
-- regex rules are set in the console (Settings → DNS server, Settings → Query log export,
-- Ad-blocking → Rules). DNSOne writes them to SETTINGS_FILE and dnsdist applies them within 2
-- seconds, without a restart.
--
-- Check after editing:  dnsdist --check-config -C /etc/dnsdist/dnsdist.conf

---------------------------------------------------------------------------------------------------
-- Settings for this server. Edit these.
---------------------------------------------------------------------------------------------------

-- Addresses to answer DNS on, UDP and TCP port 53. CHANGE_ME: this server's client-facing IPs.
local LISTEN_ADDRESSES = { "CHANGE_ME_SERVER_IP" }

-- Listener threads per address (one per core is a good start).
local LISTENERS_PER_ADDRESS = 4

-- Encrypted DNS on the same addresses, for phones (Android "Private DNS" uses DoT) and browsers
-- (DoH). Turn on once the certificate exists (docs/RUNBOOK.md, "Encrypted DNS"): the certificate
-- must name the host customers enter, e.g. dns.isp.example. Same rules as port 53: customers
-- resolve everything, everyone else only gets hosted zones.
local ENCRYPTED_DNS = false
local TLS_CERT = "/etc/dnsdist/tls/fullchain.pem"
local TLS_KEY = "/etc/dnsdist/tls/privkey.pem"
local DOT_PORT = 853
-- If the console (nginx) listens on 443 of the same address, move DoH to another port or address.
local DOH_PORT = 443
local DOH_PATHS = { "/dns-query" }

-- Written by DNSOne (runtime.py).
local SETTINGS_FILE = "/var/lib/dnsone/dnsdist/settings.lua"
-- Used until DNSOne has written SETTINGS_FILE (first start, upgrade from 1.0): the Recursor's ACL
-- file, which the runbook fills from /etc/dnsone/client-networks.conf (unreadable for dnsdist).
local FALLBACK_NETWORKS_FILE = "/var/lib/dnsone/recursor/allow-from.conf"

---------------------------------------------------------------------------------------------------
-- Listeners
---------------------------------------------------------------------------------------------------

local first = true
for _, address in ipairs(LISTEN_ADDRESSES) do
    for _ = 1, LISTENERS_PER_ADDRESS do
        local listen = address:find(":") and ("[" .. address .. "]:53") or (address .. ":53")
        if first then
            setLocal(listen, { reusePort = true })
            first = false
        else
            addLocal(listen, { reusePort = true })
        end
    end
    if ENCRYPTED_DNS then
        local host = address:find(":") and ("[" .. address .. "]") or address
        local tls = { reusePort = true, minTLSVersion = "tls1.2", numberOfStoredSessions = 20000 }
        addTLSLocal(host .. ":" .. DOT_PORT, TLS_CERT, TLS_KEY, tls)
        addDOHLocal(host .. ":" .. DOH_PORT, TLS_CERT, TLS_KEY, DOH_PATHS,
            { reusePort = true, minTLSVersion = "tls1.2", sendCacheControlHeaders = true })
    end
end

---------------------------------------------------------------------------------------------------
-- Backends
---------------------------------------------------------------------------------------------------

-- PROXY protocol: the Recursor sees each customer's address (query log, client ACL, client groups).
newServer({ address = "127.0.0.1:5300", name = "recursor", pool = "recursor", useProxyProtocol = true, checkInterval = 2, maxCheckFailures = 3 })
newServer({ address = "127.0.0.1:5301", name = "bind", pool = "auth", checkName = "localhost.", checkInterval = 5 })
-- Dynamic DNS: dnsone-ddns checks the TSIG signature and changes the records in MySQL (DNSONE_DDNS_LISTEN).
newServer({ address = "127.0.0.1:5302", name = "ddns", pool = "ddns", useProxyProtocol = true, checkName = "health.ddns.dnsone.", checkInterval = 5 })
setServFailWhenNoServer(true)
setMaxUDPOutstanding(65535)
setRingBuffersSize(100000, 8)

---------------------------------------------------------------------------------------------------
-- Hosted zones: written by the DNSOne zone generator, re-read here every 30 seconds.
---------------------------------------------------------------------------------------------------

local AUTH_ZONES_FILE = "/var/lib/dnsone/dnsdist/auth-zones.txt"
local authZones = newSuffixMatchNode()
local authList = ""

-- Rules keep a copy of the suffix set, so a changed list means a new set and a new rule set.
local function reloadAuthZones()
    local fh = io.open(AUTH_ZONES_FILE, "r")
    if fh == nil then return false end
    local names = {}
    for line in fh:lines() do
        local name = line:match("^%s*([%w%.%-_]+)%s*$")
        if name then table.insert(names, name) end
    end
    fh:close()
    table.sort(names)
    local list = table.concat(names, "\n")
    if list == authList then return false end
    local smn = newSuffixMatchNode()
    for _, name in ipairs(names) do smn:add(newDNSName(name)) end
    authZones, authList = smn, list
    return true
end
reloadAuthZones()

---------------------------------------------------------------------------------------------------
-- Settings from DNSOne: ACL, rate limits, regex rules and routing, rebuilt as one rule set
---------------------------------------------------------------------------------------------------

declareMetric("dnsone-settings-serial", "gauge", "Serial of the DNSOne settings file in use")

local function readSettings()
    local ok, cfg = pcall(dofile, SETTINGS_FILE)
    if ok and type(cfg) == "table" then return cfg end
    local nets = { "127.0.0.0/8", "::1/128" }
    local fh = io.open(FALLBACK_NETWORKS_FILE, "r")
    if fh ~= nil then
        for line in fh:lines() do
            local net = line:gsub("#.*", ""):match("^%s*(%S+)%s*$")
            if net then table.insert(nets, net) end
        end
        fh:close()
    end
    return { serial = 0, client_networks = nets, nat_addresses = {}, client_qps = 200, client_burst = 400,
             nat_qps = 5000, nat_burst = 10000, public_authoritative = true, regex = {}, regex_tlv = 0xE1, ddns = "off", xfr = {} }
end

local applied = nil
local current = nil
local dynamic = dynBlockRulesGroup()

-- dnstap (Settings → Query log export): one Frame Streams logger per target, kept across reloads.
local tapLogger, tapTarget = nil, nil
local TAP_RESPONSE_RULE = "dnsone-dnstap"
local function dnstapLogger(tap)
    if tap == nil then return nil end
    if tap.target ~= tapTarget then
        if tap.target:sub(1, 1) == "/" then
            tapLogger = newFrameStreamUnixLogger(tap.target)
        else
            tapLogger = newFrameStreamTcpLogger(tap.target)
        end
        tapTarget = tap.target
    end
    return tapLogger
end

local function applySettings(cfg)
    local clients = newNMG()
    for _, net in ipairs(cfg.client_networks) do clients:addMask(net) end
    local natPool = newNMG()
    for _, net in ipairs(cfg.nat_addresses) do natPool:addMask(net) end

    if cfg.public_authoritative then
        setACL({ "0.0.0.0/0", "::/0" })
    else
        setACL(cfg.client_networks)
    end

    local rules = {}
    local tap = dnstapLogger(cfg.dnstap)
    if tap ~= nil and cfg.dnstap.queries then
        table.insert(rules, newRuleAction(AllRule(), DnstapLogAction(cfg.dnstap.identity, tap)))
    end
    -- Blocks added on the Protection page: clients dropped, domains (and every name below) refused.
    local protection = cfg.protection or {}
    if protection.blocked_clients ~= nil and #protection.blocked_clients > 0 then
        local blocked = newNMG()
        for _, net in ipairs(protection.blocked_clients) do blocked:addMask(net) end
        table.insert(rules, newRuleAction(NetmaskGroupRule(blocked), DropAction()))
    end
    if protection.blocked_domains ~= nil and #protection.blocked_domains > 0 then
        local names = newSuffixMatchNode()
        for _, name in ipairs(protection.blocked_domains) do names:add(newDNSName(name)) end
        table.insert(rules, newRuleAction(SuffixMatchNodeRule(names, true), RCodeAction(DNSRCode.REFUSED)))
    end
    for _, rule in ipairs({
        -- ANY over UDP is an amplification favourite: answer with TC so real clients retry over TCP.
        -- (Since dnsdist 1.7 TCAction only acts on UDP, so ANY over TCP is answered normally.)
        -- Test with `dig +notcp ... ANY`: without it, dig may send ANY over TCP.
        newRuleAction(QTypeRule(DNSQType.ANY), TCAction()),
        -- Static per-address rate limits (IPv4 /32, IPv6 /64). Excess queries are dropped.
        newRuleAction(AndRule({ NetmaskGroupRule(natPool), MaxQPSIPRule(cfg.nat_qps, 32, 64, cfg.nat_burst) }), DropAction()),
        newRuleAction(AndRule({ NotRule(NetmaskGroupRule(natPool)), MaxQPSIPRule(cfg.client_qps, 32, 64, cfg.client_burst) }), DropAction()),
    }) do table.insert(rules, rule) end
    -- Zone transfers (AXFR/IXFR): only from the addresses a zone lists (Zone → Transfers), to BIND, which
    -- also checks the zone's TSIG key; every other transfer is refused, customers' included.
    local xfr = OrRule({ QTypeRule(DNSQType.AXFR), QTypeRule(DNSQType.IXFR) })
    for _, z in ipairs(cfg.xfr or {}) do
        local nets = newNMG()
        for _, net in ipairs(z.networks) do nets:addMask(net) end
        table.insert(rules, newRuleAction(AndRule({ xfr, QNameRule(z.zone), NetmaskGroupRule(nets) }), PoolAction("auth")))
    end
    table.insert(rules, newRuleAction(xfr, RCodeAction(DNSRCode.REFUSED)))
    -- Dynamic DNS updates: to dnsone-ddns, which checks the TSIG key (customers only, or from anywhere).
    if cfg.ddns == "everyone" then
        table.insert(rules, newRuleAction(OpcodeRule(DNSOpcode.Update), PoolAction("ddns")))
    elseif cfg.ddns == "customers" then
        table.insert(rules, newRuleAction(AndRule({ OpcodeRule(DNSOpcode.Update), NetmaskGroupRule(clients) }), PoolAction("ddns")))
    end
    -- Regex rules: tell the Recursor which matched (a PROXY protocol value); its policy script
    -- decides per client group. POSIX extended syntax, case-insensitive, name without the final dot.
    for _, r in ipairs(cfg.regex) do
        local ok, rule = pcall(RegexRule, r.re)
        if ok then
            table.insert(rules, newRuleAction(AndRule({ NetmaskGroupRule(clients), rule }),
                SetAdditionalProxyProtocolValueAction(cfg.regex_tlv, tostring(r.id))))
        else
            warnlog("DNSOne: skipping regex rule " .. r.id .. ": " .. tostring(rule))
        end
    end
    -- Customers: full resolver (cache, RPZ, hosted zones via the Recursor's forward-zones).
    table.insert(rules, newRuleAction(NetmaskGroupRule(clients), PoolAction("recursor")))
    -- Everyone else: hosted zones straight from BIND, nothing else.
    if cfg.public_authoritative then
        table.insert(rules, newRuleAction(SuffixMatchNodeRule(authZones, true), PoolAction("auth")))
    end
    table.insert(rules, newRuleAction(AllRule(), RCodeAction(DNSRCode.REFUSED)))
    -- Replaces the whole rule set at once: no query sees a half-applied configuration.
    setRules(rules)

    -- dnstap responses: one named response rule (and one for answers dnsdist gives itself), replaced on change.
    pcall(rmResponseRule, TAP_RESPONSE_RULE)
    pcall(rmSelfAnsweredResponseRule, TAP_RESPONSE_RULE)
    if tap ~= nil and cfg.dnstap.responses then
        addResponseAction(AllRule(), DnstapLogResponseAction(cfg.dnstap.identity, tap), { name = TAP_RESPONSE_RULE })
        addSelfAnsweredResponseAction(AllRule(), DnstapLogResponseAction(cfg.dnstap.identity, tap), { name = TAP_RESPONSE_RULE })
    end

    -- Dynamic blocks, from the last 10 seconds of traffic (the Protection page shows what they catch).
    local group = dynBlockRulesGroup()
    -- Sustained floods: 60 seconds of REFUSED.
    group:setQueryRate(cfg.client_qps * 2, 10, "Exceeded query rate", 60, DNSAction.Refused)
    group:setRCodeRate(DNSRCode.SERVFAIL, 50, 10, "Exceeded SERVFAIL rate", 60, DNSAction.Refused)
    -- A client whose answers are mostly NXDOMAIN: an infected device sending a random-subdomain attack.
    local nx = protection.nxdomain_clients
    if nx ~= nil then
        group:setRCodeRatio(DNSRCode.NXDOMAIN, nx.ratio, 10, "NXDOMAIN ratio (random-subdomain attack source)", nx.seconds, DNSAction.Drop, nx.responses)
    end
    -- A client receiving far more bytes than a real user: likely a spoofed amplification victim. TC makes
    -- real clients retry over TCP; spoofed queries get nothing large back.
    local amp = protection.amplification
    if amp ~= nil then
        group:setResponseByteRate(amp.bytes, 10, "Response byte rate (amplification)", amp.seconds, DNSAction.Truncate)
    end
    -- A domain asked for with many names that do not exist ("water torture" against its name servers):
    -- refused for everyone while it lasts. Never the zones hosted here, nor top-level domains.
    local rs = protection.random_subdomain
    if rs ~= nil then
        local zones = authZones
        group:setSuffixMatchRule(10, "Random-subdomain attack", rs.seconds, DNSAction.Refused, function(node, self, children)
            if node.labelsCount < 2 or children.nxdomains < rs.nxdomains or node:numChildren() < rs.names then return false end
            return not zones:check(newDNSName(node.fullname))
        end)
    end
    for _, net in ipairs(cfg.nat_addresses) do group:excludeRange(net) end
    -- Never the server itself (health checks, dig on the console).
    group:excludeRange("127.0.0.0/8")
    group:excludeRange("::1/128")
    dynamic = group

    setMetric("dnsone-settings-serial", cfg.serial or 0)
    applied, current = cfg.serial, cfg
    infolog("DNSOne settings applied (serial " .. tostring(cfg.serial) .. ", " .. #cfg.client_networks .. " client networks, " .. #cfg.regex .. " regex rules)")
end

applySettings(readSettings())

local tick = 0
function maintenance()
    -- A failing dynamic rule must not stop the settings below from being picked up.
    local ok, err = pcall(function() dynamic:apply() end)
    if not ok then warnlog("DNSOne: dynamic blocks: " .. tostring(err)) end
    tick = tick + 1
    if tick % 2 == 0 then
        local cfg = readSettings()
        if cfg.serial ~= applied then applySettings(cfg) end
    end
    if tick >= 30 then
        tick = 0
        if reloadAuthZones() then applySettings(current) end
    end
end

---------------------------------------------------------------------------------------------------
-- Control: statistics API for DNSOne and the operator console (loopback only)
---------------------------------------------------------------------------------------------------

webserver("127.0.0.1:8083")
setWebserverConfig({
    apiKey = "CHANGE_ME_DNSDIST_API_KEY",
    password = "CHANGE_ME_DNSDIST_WEB_PASSWORD",
    acl = "127.0.0.1/32",
    apiRequiresAuthentication = true,
})

-- `dnsdist -c` connects here (e.g. dnsdist -c -e 'showServers()'). The key is 32 random bytes,
-- base64-encoded:  head -c32 /dev/urandom | base64
controlSocket("127.0.0.1:5199")
setKey("CHANGE_ME_DNSDIST_CONSOLE_KEY")
