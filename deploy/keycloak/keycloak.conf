# Keycloak for DNSOne single sign-on. Installed as /opt/keycloak/conf/keycloak.conf (root:keycloak 0640).
# Keycloak listens on loopback only; nginx serves it at https://<console>/auth with the console's
# certificate (deploy/nginx/dnsone-keycloak.conf). After editing: kc.sh build, then restart keycloak.

# Its own database on the DNSOne MySQL server.
db=mysql
db-url=jdbc:mysql://127.0.0.1:3306/keycloak
db-username=keycloak
db-password=CHANGE_ME_KEYCLOAK_DB_PASSWORD

http-enabled=true
http-host=127.0.0.1
http-port=8180
http-relative-path=/auth
# The address browsers use; tokens carry it as their issuer. DNSOne reaches Keycloak at the same
# address (through nginx), so the issuer it checks is the same.
hostname=https://CHANGE_ME_FQDN/auth
hostname-backchannel-dynamic=true
# nginx sets X-Forwarded-For/-Proto/-Host; nothing else can reach 127.0.0.1:8180.
proxy-headers=xforwarded

# Health on the management port (127.0.0.1:9000/auth/health/ready), not through nginx.
health-enabled=true
http-management-port=9000
http-management-relative-path=/auth

log=console
