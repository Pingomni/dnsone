# DNSOne's look for Keycloak's sign-in pages (realm "Login theme": dnsone). Keycloak's own pages and
# behaviour (keycloak.v2) are kept; only the styling changes, so Keycloak upgrades keep working.
# Installed in /opt/keycloak/themes/dnsone (ops/dnsone-upgrade-1.3, ops/keycloak-theme).
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/dnsone.css
darkMode=true
